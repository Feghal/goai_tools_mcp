services:
  web:
    build:
      context: ./goai_tools_mcp
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.dev
    volumes:
      - ./goai_tools_mcp/.data/outputs:/data/outputs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 3s
      retries: 3
