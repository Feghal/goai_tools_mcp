log_format docker '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                  'req_id=$request_id upstream="$upstream_addr" upstream_status=$upstream_status '
                  'upstream_time=$upstream_response_time request_time=$request_time forwarded="$http_x_forwarded_for"';

access_log /dev/stdout docker;
error_log  /dev/stderr info;
