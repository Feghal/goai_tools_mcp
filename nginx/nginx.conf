upstream backend {
    server web:3000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # Sized for base64 tool input (MAX_INPUT_BYTES decoded, ~33% larger
    # base64-encoded, plus the JSON-RPC envelope) — see .env.prod.example.
    client_max_body_size 60m;

    location / {
        client_max_body_size 60m;
        client_body_buffer_size 128k;
        # MCP Streamable HTTP can respond with text/event-stream; buffering
        # would hold a chunk until it fills instead of forwarding it, which
        # breaks streaming responses.
        proxy_buffering off;

        proxy_pass_header       X-CSRFToken;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header HOST $http_host;
        proxy_set_header X-NginX-Proxy true;
        proxy_set_header REMOTE_ADDR $remote_addr;
        # Generous: a full-quality screenshot batch or a video-to-GIF
        # conversion can legitimately run for a while inside one request.
        proxy_connect_timeout   1500;
        proxy_send_timeout      1500;
        proxy_read_timeout      1500;
        send_timeout            1500;
        client_body_timeout     1500;

        proxy_pass http://backend;
        proxy_redirect off;
    }
}
